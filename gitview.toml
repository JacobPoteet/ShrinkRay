# Tasks GitView shows for this repository (only `name` and `command` are read).
# GitView guesses bare `dotnet build` and `dotnet test` from the solution, plus a
# `run ShrinkRay.App` and `run ShrinkRay.Gallery` for each app project. The build and
# test tasks below add `-c Release`, the configuration CI uses. The install tasks have
# no guess.

[[task]]
name = "build"
command = "dotnet build ShrinkRay.sln -c Release"

[[task]]
name = "test"
command = "dotnet test ShrinkRay.sln -c Release"

[[task]]
name = "install"
command = "powershell -ExecutionPolicy Bypass -File tools/install-local.ps1"

[[task]]
name = "install and launch"
command = "powershell -ExecutionPolicy Bypass -File tools/install-local.ps1 -Launch"
