<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
  <!-- Shell outline, one stripe, window with two reels. Every edge sits on the pixel grid. -->
  <g id="body">
    <rect x="1" y="3" width="14" height="10" fill="#3A342A"/>
    <rect x="2" y="4" width="12" height="8" fill="#D8CFBB"/>
    <rect x="3" y="5" width="10" height="1" fill="#E8932F"/>
  </g>
  <rect id="window" x="3" y="7" width="10" height="4" fill="#26221C"/>
  <rect class="reel" x="5" y="8" width="2" height="2" fill="#E9E2D0"/>
  <rect class="reel" x="9" y="8" width="2" height="2" fill="#E9E2D0"/>
</svg>
